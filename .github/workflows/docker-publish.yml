name: Docker Publish

on:
  push:
    tags:
      - "v*"

jobs:
  push:
    name: Build and push ghcr.io/soundmatt/c-fusa
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/soundmatt/c-fusa
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          # metadata-action can't detect an SPDX license from the GitHub API
          # and defaults org.opencontainers.image.licenses to NOASSERTION,
          # which silently overrides the correct value the Dockerfile's own
          # LABEL sets (matching keys passed to build-push-action win over
          # the Dockerfile). Override it explicitly so the published image
          # actually carries "MPL-2.0" (see issue #62 item 1).
          labels: |
            org.opencontainers.image.licenses=MPL-2.0

      - name: Read spec version from version.h
        id: version
        run: |
          spec=$(grep -oP 'CFUSA_SPEC_VERSION\s+"\K[^"]+' include/cfusa/version.h)
          echo "spec-version=$spec" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CFUSA_VERSION=${{ steps.meta.outputs.version }}
            CFUSA_SPEC_VERSION=${{ steps.version.outputs.spec-version }}
