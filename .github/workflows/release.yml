name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  build-release:
    name: Build release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: cfusa-linux-amd64
            binary: cfusa
          - os: macos-14
            artifact: cfusa-darwin-arm64
            binary: cfusa

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update -y && sudo apt-get install -y cmake

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel $(nproc 2>/dev/null || sysctl -n hw.ncpu)

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Package binary
        run: |
          cp build/${{ matrix.binary }} ${{ matrix.artifact }}
          sha256sum ${{ matrix.artifact }} > ${{ matrix.artifact }}.sha256 2>/dev/null \
            || shasum -a 256 ${{ matrix.artifact }} > ${{ matrix.artifact }}.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-22.04
    needs: build-release

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Extract release notes from CHANGELOG.md
        id: changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Matches both "## vX.Y.Z — date" (current style) and the older
          # "## [X.Y.Z] — date" bracketed style; stops at the next "## " heading.
          awk -v ver="$version" '
            /^## / {
              if (found) exit
              line = $0
              gsub(/[][]/, "", line)
              if (line ~ ("^## v?" ver "( |$)")) { found = 1 }
              next
            }
            found { print }
          ' CHANGELOG.md > changelog-section.md

          if [ ! -s changelog-section.md ]; then
            echo "::warning::No CHANGELOG.md section found for ${GITHUB_REF_NAME} — falling back to generic body."
            echo "_No CHANGELOG.md entry found for this release — see commit history._" > changelog-section.md
          fi

          {
            echo "## cfusa ${GITHUB_REF_NAME}"
            echo
            cat changelog-section.md
            echo
            echo "### Installation"
            echo
            echo '```bash'
            echo "# Linux (amd64)"
            echo "curl -Lo cfusa https://github.com/SoundMatt/c-FuSa/releases/download/${GITHUB_REF_NAME}/cfusa-linux-amd64"
            echo "chmod +x cfusa && sudo mv cfusa /usr/local/bin/"
            echo
            echo "# macOS (arm64)"
            echo "curl -Lo cfusa https://github.com/SoundMatt/c-FuSa/releases/download/${GITHUB_REF_NAME}/cfusa-darwin-arm64"
            echo "chmod +x cfusa && sudo mv cfusa /usr/local/bin/"
            echo
            echo "# From source"
            echo "cmake -B build -DCMAKE_BUILD_TYPE=Release && cmake --install build"
            echo '```'
            echo
            echo "### Verify"
            echo '```bash'
            echo "cfusa version"
            echo "cfusa qualify"
            echo '```'
          } > release-notes.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
          body_path: release-notes.md
